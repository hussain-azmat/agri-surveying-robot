name: firmware

# Test + compile on every change. On main, when FW_VERSION in config.h was bumped, publish the image to
# ota/ so every rover picks it up the next time it is stopped and online.
#
#   change code -> bump version (python tools/bump_version.py patch) -> push -> this workflow
#   compiles it -> writes ota/firmware.bin + ota/version.txt (version, MD5, size) -> commits them.
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tools/**"
      - "test/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tools/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: write   # only used by the publish step, which runs on main only

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false   # never cancel a publish half-way

env:
  ESP32_CORE: "3.1.3"          # the core the firmware is tested against (see docs/ARCHITECTURE.md)
  ARDUINOJSON: "7.4.2"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Host unit tests (GPS parser, geometry, path following, safety, OTA logic)
        run: ./tools/test_host.sh

      - name: Python tool tests (OTA publisher, log consolidation, version bump)
        run: python3 -m unittest tools.test_tools -v

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache the ESP32 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ env.ESP32_CORE }}-${{ env.ARDUINOJSON }}

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}
          arduino-cli lib install "ArduinoJson@${ARDUINOJSON}"

      - name: Compile (limit = the real OTA slot from partitions.csv)
        run: python3 tools/build_firmware.py --out build/out

      - name: Keep the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/out/agri_rover.ino.bin
            build/out/agri_rover.ino.merged.bin
          retention-days: 30

      - name: Publish to ota/ (main only; only if FW_VERSION was bumped)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: publish
        run: python3 tools/publish_ota.py --bin build/out/agri_rover.ino.bin

      - name: Commit the published image
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/version.txt ota/firmware.bin
          git commit -m "ota: publish $(grep '^version=' ota/version.txt | cut -d= -f2) [skip ci]"
          # Rovers also commit logs to main; if main moved while we built, rebase and retry.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          echo "could not push the OTA image after 5 tries" >&2
          exit 1
