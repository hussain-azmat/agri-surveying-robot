# Runtime configuration for the rover. NO REBUILD NEEDED: the rover fetches this file about once a
# minute while it is stopped and online, and applies it. Plain "key=value", '#' starts a comment.
#
# Every value is CLAMPED to a safe range by the firmware (Software/OTA/Src/ota_github.cpp), so a typo
# or a bad edit can make the rover less capable but never unsafe. Remove a line to use the default.
#
# Defaults shown in brackets. Safe range after the dash.

# Manual driving: fraction of full speed the joystick can reach.   [0.8]   0.1 - 1.0
max_speed=0.8

# Auto mode (path following): throttle on straights.               [0.6]   0.1 - 0.8
auto_speed=0.6

# A waypoint counts as reached inside this radius. The NEO-6M is accurate to ~2.5 m, so 3-5 m is
# realistic; smaller radii make waypoints unreachable.             [4.0]   3 - 15  metres
accept_radius_m=4.0

# Auto mode stops if the rover is this far from the path.          [8.0]   5 - 50  metres
# (the firmware keeps it at least 2 m above accept_radius_m)
offpath_m=8.0

# Manual mode: stop if no drive command arrives for this long.     [500]   200 - 1000 ms
cmd_timeout_ms=500

# Auto mode: stop if the control page goes quiet for this long.    [3000]  1000 - 10000 ms
link_timeout_ms=3000

# Auto mode refuses to start / stops if GPS HDOP is worse than this.  [5.0]  1 - 20
hdop_max=5.0

# Battery thresholds in volts. ONLY USED once a battery divider is fitted and BATT_SENSE_ENABLED is 1
# in config.h. Defaults suit a 3S Li-ion pack (3.4 V and 3.2 V per cell): CHANGE FOR OTHER CHEMISTRIES.
batt_low_v=10.2
batt_crit_v=9.6

# Path recording: keep a point every this many metres, or on a turn of this many degrees.
path_spacing_m=1.5       # 1 - 5
path_turn_deg=15         # 5 - 45

# Yaw rate (deg/s) the rover produces at full turn command. CALIBRATE ON THE REAL ROVER (spin it at
# turn=1 and read the gyro rate on the control page); path following accuracy depends on this.
turn_full_dps=90         # 20 - 360

# How long the rover must be stopped before it uploads logs.       [20]    5 - 600 s
upload_idle_s=20
# Config / update check intervals while stopped and online.
sync_interval_s=60       # 30 - 3600
ota_interval_s=300       # 60 - 86400

# Set to off to stop writing the log.
logging=on
# One log row for every Nth GPS fix. The GPS runs at 5 Hz, so 1 = 5 rows per second (about 17 minutes of flash when the rover
# cannot upload), 5 = 1 row per second (about 85 minutes). The IMU values in a row are averaged over the time since the
# previous row, so a larger number loses detail but not accuracy.                                          [1]   1 - 50
log_every=1
# on = also log while DISARMED, from power-up (for GPS accuracy or IMU drift tests while standing still). Uses flash faster,
# and rows keep coming while the rover uploads. off = log only while armed.                                  [off]
log_always=off

# Install a newer firmware by itself when the rover is stopped and online (checked at power-up as soon as it has
# internet, then every ota_interval_s). Set to off to only report it: then press "Install update" on the control page.
auto_update=on
